spring:
  application:
    name: jango-api

  config:
    # `.env` 를 앱이 직접 읽는다. 아래 ${...} 가 전부 여기서 채워진다.
    #
    # 없으면 IDE 마다 런 구성에 환경변수를 따로 꽂아야 하고, 안 꽂은 사람은
    # `Driver org.postgresql.Driver claims to not accept jdbcUrl,
    #  jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}` 로 막힌다.
    # @ConfigurationProperties 바인더는 못 찾은 플레이스홀더를 오류로 내지 않고
    # 원문 그대로 넘기므로, 증상이 「설정 누락」이 아니라 「DB 드라이버 문제」로 보인다.
    #
    # `[.properties]` 는 확장자 없는 파일의 파싱 방식을 지정하는 힌트다.
    # `.env` 에 export 접두사·따옴표·백슬래시가 없어야 이 파싱과 맞는다 —
    # 값에 공백이 있어 따옴표를 씌우고 싶어지면 따옴표까지 값이 된다.
    #
    # 경로가 프로세스 작업 디렉터리 기준이라 `backend/` 에서 띄울 때만 잡힌다.
    # 배포에는 걸리지 않는다 — `optional:` 이고 컨테이너에는 `.env` 가 없다.
    # 거기서는 컨테이너 환경변수가 같은 자리를 채운다.
    import: optional:file:./.env[.properties]

  # 시크릿은 기본값을 두지 않는다 — 미주입 시 부팅 실패(fail-fast).
  # 인프라 제약 §4.1 #5, #6
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 인프라 제약 §4.2 #15 — PostgreSQL max_connections=100.
      # 이 중 2~3은 DB 작업 테이블 폴링 워커가 점유한다(아키텍처 §7).
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      # 아키텍처 D-7 — 협상 대상 아님. 스키마는 Flyway가 유일한 기준.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    # jango-api 부팅 시 자동 실행 (아키텍처 §5)
    schemas: core,forecast
    default-schema: core
    # 롤백 조건 1 — 이전 태그 재배포 시 미래 마이그레이션을 무시하고 기동.
    # 이것 없이는 롤백이 필요한 순간에 앱이 뜨지 않는다.
    # 조건 2(expand-and-contract)는 마이그레이션 작성 규칙으로 지킨다.
    #
    # ⚠ 이 속성을 명시하면 Flyway 기본값을 '덮어쓴다'. 기본값이 "*:future" 이므로
    #   (flyway-core 11.14.1 의 FlywayModel 에서 확인) 예전 값 "*:missing" 은
    #   future 무시를 없애버려 롤백을 살리려던 설정이 정작 롤백을 깨는 형태였다.
    #
    #   롤백 상황(DB=V5, jar=V4)은 "적용분이 로컬 최대 버전보다 높음" = future 다.
    #   missing 은 로컬 최대 버전 이하인데 파일이 사라진 경우로, 진짜 드리프트를 가린다.
    #
    #   기본값과 같은 값이지만 의도를 문서화하려고 명시해 둔다.
    #   실측은 Phase 5 에서 v1→v2→v1 재배포로 확인한다.
    ignore-migration-patterns: "*:future"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
    web:
      pageable:
        # API 2.3 — page 0-base, size 기본 20 / 최대 100
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

  servlet:
    multipart:
      # 인프라 합의 — nginx client_max_body_size 32m 와 짝.
      # nginx 쪽을 더 크게 두어야 413 대신 애플리케이션 오류로 반환된다.
      max-file-size: 10MB
      max-request-size: 32MB

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: 8080
  # 인프라 제약 §4.2 #12 — 배포 시 컨테이너 재생성. 처리 중 요청 유실 방지.
  shutdown: graceful
  # 인프라 제약 §4.2 #13 — nginx가 X-Forwarded-Proto: https 전달.
  # 미설정 시 앱이 http:// 링크를 만들어 리다이렉트 루프가 난다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # 외부 미노출(내부 네트워크 전용). compose healthcheck 용도.
        include: health,info
  endpoint:
    health:
      probes:
        # 인프라 제약 §4.2 #11 — liveness/readiness 분리.
        # depends_on: service_healthy 로 DB 준비 전 부팅 크래시를 막는다.
        enabled: true
      show-details: never

logging:
  # 인프라 제약 §4.1 #7 — stdout 전용. 파일 출력 금지(Docker json-file 로테이션 밖).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 애플리케이션 고유 설정
jango:
  classification:
    # API 20.3 — 이 값 미만이면 needs_confirmation = true.
    # 사용자가 확인할 물량을 직접 정하는 값이라 코드가 아니라 설정에 둔다.
    confidence-threshold: ${CLASSIFICATION_CONFIDENCE_THRESHOLD:0.85}
    # 한 Job 이 워커에 보낼 거래 수. 워커 상한은 400 이고 그 안에서 20건씩 잘라 부른다.
    # 올릴 때는 jango.job.stall-timeout(10분) 예산을 먼저 확인한다 - 400 이 약 300초다.
    batch-size: ${CLASSIFICATION_BATCH_SIZE:20}
    # 프롬프트에 붙일 사용자 정정 예시 수(20.3). 프리픽스 캐시에 올라가 하루 1회만
    # 값을 치르므로 늘리는 비용이 작다. 최적값은 아직 재지 않았다.
    few-shot-size: ${CLASSIFICATION_FEW_SHOT_SIZE:10}
    # 동기화·CSV 임포트가 끝나면 분류를 스스로 걸 것인가(8.5 "자동 실행").
    # 기본은 꺼짐 - 거래가 들어올 때마다 LLM 을 부르면 시드를 넣고 빼는 동안 그대로 토큰이 된다.
    # 끄면 분류는 8.5 버튼으로만 돈다(POST /businesses/{id}/classification-jobs).
    # 켤 때는 워커가 떠 있는지 먼저 본다.
    auto-trigger: ${CLASSIFICATION_AUTO_TRIGGER:false}
  storage:
    # 인프라 제약 §4.1 #9 — 컨테이너 내부 고정 경로. 호스트 경로 하드코딩 금지.
    root: ${STORAGE_ROOT:/data/uploads}
  job:
    # 스위퍼 주기. @Scheduled(fixedDelayString) 가 직접 읽는다 — JobProperties 에는 없다.
    # ISO-8601 표기는 jango.security.jwt.* 와 맞춘 것이다.
    sweep-interval: ${JOB_SWEEP_INTERVAL:PT5M}
    # PROCESSING 잔류 판정 기준. 공통규약 23장 — 10분.
    # ⚠ 동기 완결형 핸들러의 실행 시간 상한이기도 하다(넘기면 스위퍼가 중복 실행을 만든다).
    stall-timeout: ${JOB_STALL_TIMEOUT:PT10M}
    # 2 = 최초 1회 + 재시도 1회. CLAIM_SQL 이 획득마다 올려 첫 획득 직후 값은 1 이다.
    max-attempts: ${JOB_MAX_ATTEMPTS:2}
    # 워커가 받지 못한(202 미수신) 작업을 되돌린 뒤 다시 집기까지. stall-timeout 과 다른
    # 축이다 - 그쪽은 "접수됐는데 답이 없다", 이쪽은 "접수조차 안 됐다".
    rejection-retry-delay: ${JOB_REJECTION_RETRY_DELAY:PT30S}
    # 폴링 루프 스레드 수. 0 이면 워커 미기동(테스트가 0 을 준다).
    # 위 hikari 주석의 "워커 몫 2~3" 예산이 이 값 + 스위퍼 1 이다.
    worker-count: ${JOB_WORKER_COUNT:2}
    # 큐가 비었을 때 다음 폴링까지 대기. GET /jobs/{jobId} 체감 지연의 하한.
    poll-interval: ${JOB_POLL_INTERVAL:PT2S}
  forecast:
    # 한 실행이 계산하는 일수. 조회의 days(7·14·30)와 다르다 —
    # 실행은 항상 30일로 한 번 하고 조회에서 자른다(공통규약 2.6).
    # ix_fr_latest 가 기간을 구분하지 않아 기간별로 저장하면 "최신"이 엉뚱한 실행을 가리킨다.
    horizon-days: ${FORECAST_HORIZON_DAYS:30}
    # 같은 사업장의 재계산 요청을 모으는 시간. 공통규약 2.6 — 5초.
    # 없으면 CSV 200건 업로드에 200회 재계산이 돈다.
    debounce: ${FORECAST_DEBOUNCE:PT5S}
    # 사업장 단위 실행 락. 잔여 모델 호출(15초)에 DB 왕복을 더한 것보다 넉넉해야 한다.
    lock-ttl: ${FORECAST_LOCK_TTL:PT2M}
    # 재계산 대기 표시. Redis 가 volatile-lru 라 모든 키에 TTL 이 필수다(공통규약 23장).
    dirty-ttl: ${FORECAST_DIRTY_TTL:PT1H}
    # 잔여 축 상한. NONE | BASELINE | MODEL. 상한일 뿐이고 실제 경로는 폴백 사슬이 정한다 —
    # 워커가 없거나 응답이 검증을 통과하지 못하면 통계로, 표본이 30일 미만이면 미적용으로 내려간다.
    # 최소 매처(API 9.5)가 섰으므로 MODEL 이다. 매칭 없이 태우면 잔여가 「실제 거래 전부」가
    # 되어 예정 거래를 두 번 셌는데(설계노트 M-1), 이제 매칭된 예정 거래가 잔여에서 빠진다.
    residual-mode: ${FORECAST_RESIDUAL_MODE:MODEL}
    # 판정 보수성 α. 모델 경로는 워커가 준 값을 쓰고 통계·미적용 경로가 이 값을 쓴다.
    # 두 경로에 같은 α 여야 모델 채택 비교가 성립한다(설계노트 M-3). 올리면 채택 근거가 사라진다.
    judgment-alpha: ${FORECAST_JUDGMENT_ALPHA:0.00}
    # 실행 스레드 기동 여부. 0 이 아니라 boolean 인 이유는 스레드가 하나뿐이기 때문이다.
    enabled: ${FORECAST_WORKER_ENABLED:true}
    # 전 사업장 재계산. 트리거가 유실돼도 하루 안에 회수하는 안전망이다(공통규약 2.6).
    # 새벽인 이유는 예정 거래의 날짜 경계가 막 넘어간 시점이라, 아침에 열면 오늘 기준
    # 곡선이 이미 서 있기 때문이다. @Scheduled 가 직접 읽으므로 ForecastProperties 에는 없다.
    daily-cron: ${FORECAST_DAILY_CRON:0 0 4 * * *}
    # 30일 지난 실행 정리. 위와 시각을 벌려 둔다 — 스케줄러 스레드가 하나라
    # JobSweeper 와 공유하므로 두 배치가 같은 순간에 깨어나지 않게 한다.
    cleanup-cron: ${FORECAST_CLEANUP_CRON:0 30 4 * * *}
  planned-execution:
    # 예정 거래를 금융망 샌드박스 계좌에 실제로 반영한다(API 9.6). 계좌 단위 opt-in
    # (ACCOUNT.auto_execute_planned, 기본 false)이 걸린 계좌에서만 돈다 — 이 값만으로는
    # 아무 일도 일어나지 않는다.
    enabled: ${PLANNED_EXECUTION_ENABLED:true}
    # 차례 사이 간격. 예정 거래는 하루 단위라 자주 볼 이유가 없다.
    poll-interval: ${PLANNED_EXECUTION_POLL_INTERVAL:PT10M}
    # 기동 후 첫 차례. 낮에 켠 로컬 서버가 밀린 회차를 곧 집도록 짧게 둔다.
    initial-delay: ${PLANNED_EXECUTION_INITIAL_DELAY:PT30S}
    # 당일자를 보내기 시작하는 시각(KST). 04:00~04:35 는 예측 배치·정리 배치·호스트 백업이
    # 겹치는 구간이라 피한다. 금융망 예약이체 재실행 시각도 09:00 이다.
    earliest-time: ${PLANNED_EXECUTION_EARLIEST_TIME:09:00}
    # 지난 예정일을 며칠까지 따라잡나. 거래내역 사전 조회 창의 길이이기도 하다 —
    # 다른 서버가 예정일에 보낸 것을 늦게 보려면 그 날짜까지 거슬러 봐야 한다.
    catch-up-days: ${PLANNED_EXECUTION_CATCH_UP_DAYS:3}
    # 답을 못 받은 건의 재전송 상한. 넘으면 영구 실패로 접고 사람이 본다.
    max-attempts: ${PLANNED_EXECUTION_MAX_ATTEMPTS:3}
    # 한 차례에 한 계좌로 보낼 수 있는 최대 건수. 설정 사고의 상한이다.
    max-per-account-per-tick: ${PLANNED_EXECUTION_MAX_PER_TICK:20}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl: ${JWT_ACCESS_TTL:PT30M}
      refresh-ttl: ${JWT_REFRESH_TTL:P14D}
    encryption-key: ${APP_ENCRYPTION_KEY}
  finopenapi:
    base-url: ${FINOPENAPI_BASE_URL}
    api-key: ${FINOPENAPI_API_KEY}
    institution-code: ${FINOPENAPI_INSTITUTION_CODE}
    fintech-app-no: ${FINOPENAPI_FINTECH_APP_NO}
    client:
      connect-timeout: ${FINOPENAPI_CONNECT_TIMEOUT:PT3S}
      # DD_12 는 페이지네이션이 없어 한 달치가 한 응답으로 온다.
      # AI 워커 접수(5초)보다 길게 잡는 이유다.
      read-timeout: ${FINOPENAPI_READ_TIMEOUT:PT15S}
    account-auth:
      # ACCOUNT_AUTH_01 과 02 에서 같아야 한다. 통장 적요에 "{authText} {코드4자리}" 로 찍힌다.
      auth-text: ${ACCOUNT_AUTH_TEXT:잔고예보}
      # 공통규약 23장 열린 항목. 정해지면 이 두 값만 바꾼다.
      ttl: ${ACCOUNT_AUTH_TTL:PT10M}
      max-resend: ${ACCOUNT_AUTH_MAX_RESEND:3}
  ai:
    base-url: ${AI_SERVICE_BASE_URL}
    # 워커의 SERVICE_TOKEN(ai/.env)과 값이 같아야 한다. 시크릿이라 기본값 없음.
    service-token: ${AI_SERVICE_TOKEN}
    client:
      connect-timeout: ${AI_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${AI_READ_TIMEOUT:PT5S}
      # 잔여 예측(20.11)만 동기 15초다. 위 5초로 부르면 규격보다 먼저 끊긴다.
      # 위 값을 올리지 않는 이유는 그것이 콜백 처리 예산과 묶여 있기 때문이다.
      forecast-read-timeout: ${AI_FORECAST_READ_TIMEOUT:PT15S}
    callback:
      # 공통규약 23장 — X-Request-Id Redis TTL 24시간
      idempotency-ttl: ${AI_CALLBACK_IDEMPOTENCY_TTL:PT24H}
      # 처리 중 선점. jango.job.stall-timeout(10분)보다 짧아야 한다 —
      # 선점 직후 죽어도 키가 먼저 사라져야 스위퍼 회수 후 재실행이 막히지 않는다.
      claim-ttl: ${AI_CALLBACK_CLAIM_TTL:PT1M}

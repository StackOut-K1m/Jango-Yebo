# 컨테이너 안쪽 nginx. TLS·/api/ 라우팅은 바깥 edge-nginx 가 맡는다 — 여기서 /api/ 를 프록시하지 않는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 산출물 — 영구 캐시. expires 를 같이 쓰면 Cache-Control 이 두 줄 나가 한 줄로 쓴다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 이름이 고정이라 캐시하면 새 배포 뒤에도 옛 화면이 뜬다
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 라우팅. 이게 없으면 /transactions 새로고침이 404 다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔고예보 · 리포트·브리핑 (PC)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="sky.css">
<link rel="stylesheet" href="features.css">
<link rel="stylesheet" href="pc.css">
<style>
/* SC-09 리포트 · 브리핑 (P1-17 · P1-19)
   이 제품에서 유일하게 조작이 아니라 읽는 화면입니다. 월요일 아침에 오는 편지입니다.
   그래서 넓은 축에 표를 깔지 않고, 본문 폭을 62자로 제한하고 곁줄에 근거를 둡니다.
   문장에 쓴 숫자는 전부 왼쪽 곁줄에서 확인할 수 있습니다. 모델이 새 숫자를 만들지 않습니다. */
.letter { font-family:var(--serif); font-size:17px; line-height:1.95; color:var(--ink-2); }
.letter h2 { font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.08em;
             color:var(--ink-3); margin-top:var(--s9); }
.letter h2:first-child { margin-top:0; }
.letter p { margin-top:var(--s4); }
.letter b { color:var(--ink); font-weight:700; }
/* 문장 속 숫자를 누르면 곁줄에서 근거가 켜집니다 */
.letter .cite { border-bottom:1.5px solid var(--hair); cursor:pointer; font-weight:700; color:var(--ink); }
.letter .cite:hover, .letter .cite.on { border-bottom-color:var(--ink); background:rgb(202 165 33 / .22); }

.rail2 { position:sticky; top:var(--s7); align-self:start; }
.rail2 h3 { font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--ink-3); }
.src { padding:var(--s4) 0; position:relative; }
.src + .src::before { content:""; position:absolute; left:0; right:0; top:0; height:1px; background:var(--hair); }
.src.on { background:rgb(202 165 33 / .18); margin:0 calc(var(--s4) * -1); padding-left:var(--s4);
          padding-right:var(--s4); border-radius:8px; }
.src.on::before, .src.on + .src::before { opacity:0; }
.src .k { font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.03em; }
.src .v { font-size:17px; font-weight:800; letter-spacing:-.02em; margin-top:2px; display:block;
          font-variant-numeric:tabular-nums; }
.src .s { font-size:11px; color:var(--ink-3); margin-top:2px; display:block; line-height:1.5; }
.wk { display:flex; gap:var(--s2); flex-wrap:wrap; }
</style>
</head>
<body>

<header class="sky slim" id="sky">
  <div class="top" id="top"></div>
  <div class="answer">
    <p class="when">8월 넷째 주 · 월요일 아침에 옵니다</p>
    <h1 class="hero">이번 주는 <b>재료값이 남는 돈을 밀어냈습니다</b></h1>
    <p class="lede">수치는 예보 엔진이 계산하고, 문장으로 옮기는 일만 모델이 합니다. 없는 숫자를 만들지 않습니다.</p>
  </div>
</header>

<div class="work no-detail">

  <aside class="side">
    <div class="grp">
      <h3>어느 주</h3>
      <div class="wk" id="weeks"></div>
    </div>
    <div class="grp rail2">
      <h3>문장에 쓴 숫자</h3>
      <p class="dm" style="font-size:11px;color:var(--ink-3);margin-top:var(--s3);line-height:1.55">
        본문에서 밑줄 친 숫자를 누르면 여기에서 근거가 켜집니다.</p>
      <div id="srcs" style="margin-top:var(--s5)"></div>
    </div>
  </aside>

  <main class="body">
    <div class="reading">
      <article class="letter" id="letter"></article>
      <aside>
        <h3 style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)">이번 주 숫자</h3>
        <div class="figs" style="grid-template-columns:minmax(0,1fr);gap:var(--s7);margin-top:var(--s5)" id="figs"></div>
        <h3 style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink-3);margin-top:var(--s9)">지난 브리핑</h3>
        <div class="rows" id="hist"></div>
      </aside>
    </div>
  </main>
</div>

<div class="pin" id="pin"></div>

<script src="sky.js"></script>
<script src="nav.js"></script>
<script src="features.js"></script>
<script src="store.js"></script>
<script>
document.getElementById('top').outerHTML = pcTop('report');
wireSwitch();
(function () {
  var k = SKYC['safe'], s = document.getElementById('sky');
  s.style.setProperty('--k0',k[0]); s.style.setProperty('--k1',k[1]); s.style.setProperty('--k2',k[2]);
})();

/* ── 네 주의 브리핑 ──
   전에는 8월 넷째 주만 본문이 있고 나머지는 "이 시안에는 없습니다"라는 안내가 떴습니다.
   버튼이 눌리는데 내용이 없으면 눌린 게 아닙니다. 네 주를 다 씁니다.

   주별 매출 합이 8월 매출과 맞아야 합니다.
     9,268,000 + 10,383,000 + 9,445,000 + 9,842,000 = 38,938,000
     + 그 밖 3,246,000 (8월 1일 · 2일 · 31일) = 42,184,000

   문장에 나오는 숫자는 전부 그 주의 근거 목록에 있습니다.
   근거에 없는 숫자는 문장에도 쓰지 않습니다. 모델이 새 숫자를 만들지 않습니다. */
var cite = function (k, txt) { return '<span class="cite" data-s="' + k + '">' + txt + '</span>'; };

var WEEKS = [
  { label:'8월 넷째 주', span:'8월 24일 ~ 30일', risk:'safe',

      quick:  ['빠른정산 수수료', '84,368원', '8월 매출 42,184,000원의 0.2%']
    },
    body: function () { return ''
      + '<h2>이번 주에 있었던 일</h2>'
      + '<p>매출은 늘었는데 남는 돈은 줄었습니다. 이번 주 매출은 ' + cite('sales','9,842,000원')
        + '으로 지난주보다 ' + cite('up','4.2%') + ' 늘었습니다. 그런데 남는 돈은 '

        + cite('pork','kg당 15,800원') + '까지 올랐습니다. 3주 전에는 13,400원이었습니다. '
        + '<b>매출이 늘어도 재료값이 그만큼 오르면 남는 돈은 줄어듭니다.</b></p>'
      + '<h2>다음 주 예보</h2>'
      + '<p>9월 3일에 잔고가 ' + cite('low','1,487,600원')
        + '까지 내려갈 가능성이 있습니다. 안전선보다 812,400원 모자랍니다.</p>'
      + '<p>더 조심해야 할 자리는 그 뒤입니다. 9월 10일에 ' + cite('loan','1,680,000원')
        + '의 대출 상환이 나가고, 그 직후 ' + cite('gapd','사흘 동안 정산이 들어오지 않습니다')
        + '. 주말과 월요일 휴무가 겹치기 때문입니다. '
        + '<b>나갈 돈은 날짜가 정해져 있는데 들어올 돈은 사흘 쉽니다.</b></p>'

  { label:'8월 셋째 주', span:'8월 17일 ~ 23일', risk:'caution',
    head:'이번 주는 <b>배달 비중이 처음 30%를 넘었습니다</b>',
    figs:['sales','deli','fee','hall'],
    src:{
      sales: ['이번 주 매출', '9,445,000원', '카드 5,398,000 + 배달 2,847,000 + 현금 1,200,000'],
      deli:  ['배달 비중', '30.1%', '2,847,000원. 지난주는 24.8%였습니다'],
      fee:   ['배달 수수료', '598,000원', '배달 매출의 21.0%. 중개 · 결제 · 배달비 합계'],
      hall:  ['홀 매출', '5,398,000원', '지난주 5,912,000원에서 514,000원 줄었습니다'],
      rain:  ['비 온 날', '4일', '8월 18 · 19 · 21 · 22일'],
      net:   ['배달 실수령', '2,249,000원', '2,847,000원에서 수수료 598,000원을 뺀 금액']
    },
    body: function () { return ''
      + '<h2>이번 주에 있었던 일</h2>'
      + '<p>배달이 처음으로 매출의 ' + cite('deli','30%를 넘었습니다') + '. '

      + '<h2>해 볼 만한 것</h2>'
      + '<p>배달 최소 주문 금액을 올리면 건당 수수료 부담이 줄어듭니다. '
        + '다만 주문 수가 같이 줄 수 있어 한 주만 시험해 보는 편이 낫습니다.</p>'; } },

  { label:'8월 둘째 주', span:'8월 10일 ~ 16일', risk:'caution',
    head:'이번 주는 <b>현금 마감이 나흘 비어 예보가 흔들렸습니다</b>',
    figs:['sales','cash','band','holi'],
    src:{
      sales: ['이번 주 매출', '10,383,000원', '광복절 연휴가 껴서 8월 가운데 가장 높습니다'],
      holi:  ['연휴 사흘 매출', '4,912,000원', '8월 15 · 16일과 앞뒤. 평소 사흘의 1.4배'],
      cash:  ['현금 마감 빠진 날', '4일', '8월 11 · 12 · 13 · 14일. 마감 입력이 없었습니다'],
      band:  ['예보 범위 폭', '±1,284,000원', '평소 ±412,000원. 세 배 넓어졌습니다'],
      guess: ['채워 넣은 현금', '1,608,000원', '앞 4주 같은 요일 평균으로 메웠습니다']
    },
    body: function () { return ''
      + '<h2>이번 주에 있었던 일</h2>'
      + '<p>광복절 연휴로 매출이 ' + cite('sales','10,383,000원') + '까지 올랐습니다. '
        + '연휴 사흘만 ' + cite('holi','4,912,000원') + '입니다.</p>'
      + '<p>그런데 ' + cite('cash','나흘 동안 현금 마감이 들어오지 않았습니다') + '. '
        + '그만큼은 앞 4주 같은 요일 평균으로 ' + cite('guess','1,608,000원') + '을 채워 넣었습니다. '
        + '<b>채워 넣은 값이라 이번 주 예보 범위는 ' + cite('band','평소의 세 배') + '로 넓습니다.</b> '
        + '숫자 하나를 말하기 어려운 주입니다.</p>'
      + '<h2>다음 주 예보</h2>'
      + '<p>현금 마감이 다시 들어오면 범위가 한 주 만에 좁아집니다. '
        + '연휴 매출은 다음 주에 반복되지 않으니 평소 수준으로 돌아온다고 보고 있습니다.</p>'
      + '<h2>해 볼 만한 것</h2>'
      + '<p>현금 마감은 하루만 밀려도 예보가 흔들립니다. 영업 종료 뒤 알림을 켜 두면 '
        + '빠뜨리는 날이 줄어듭니다.</p>'; } },

  { label:'8월 첫째 주', span:'8월 3일 ~ 9일', risk:'danger',
    head:'이번 주는 <b>임차료가 오른 첫 달입니다</b>',
    figs:['sales','rent','profit','years'],
    src:{
      sales:  ['이번 주 매출', '9,268,000원', '카드 5,847,000 + 배달 2,298,000 + 현금 1,123,000'],
      rent:   ['새 임차료', '1,500,000원', '8월 1일부터. 전에는 1,350,000원이었습니다'],
      up:     ['오른 금액', '150,000원', '월 11.1% 인상. 연 1,800,000원 늘어납니다'],
      profit: ['남는 돈', '206,000원', '임차료 인상분을 그대로 맞은 첫 주입니다'],
      years:  ['다음 갱신', '2028년 7월', '2년 계약. 그 사이에는 오르지 않습니다']
    },
    body: function () { return ''
      + '<h2>이번 주에 있었던 일</h2>'
      + '<p>8월 1일부터 임차료가 ' + cite('rent','1,500,000원') + '으로 올랐습니다. '
        + cite('up','한 달 150,000원') + ' 오른 것으로, 1년이면 1,800,000원입니다.</p>'
      + '<p>이번 주 매출은 ' + cite('sales','9,268,000원') + '으로 나쁘지 않았는데 '
        + '남는 돈은 ' + cite('profit','206,000원') + '에 그쳤습니다. '
        + '<b>인상분은 매달 같은 날 같은 금액으로 나갑니다.</b> '
        + '한 번 오르면 다음 갱신인 ' + cite('years','2028년 7월') + '까지 그대로입니다.</p>'
      + '<h2>다음 주 예보</h2>'
      + '<p>임차료는 매달 1일에 나갑니다. 9월 1일에도 같은 금액이 빠집니다. '
        + '이 달부터는 안전선을 다시 잡아야 합니다.</p>'
      + '<h2>해 볼 만한 것</h2>'
      + '<p>월 150,000원은 하루 5,000원입니다. 점심 한 그릇을 더 파는 것으로 메울 수 있는 크기이니, '
        + '메뉴판 위치를 바꿔 보는 것부터 해 볼 만합니다.</p>'; } }
];

var wk = 0;

function drawWeek(n) {
  wk = n;
  var W = WEEKS[n];
  var k = SKYC[W.risk], sky = document.getElementById('sky');
  sky.style.setProperty('--k0', k[0]);
  sky.style.setProperty('--k1', k[1]);
  sky.style.setProperty('--k2', k[2]);
  sky.dataset.w = W.risk;

  document.querySelector('.when').textContent = W.label + ' · ' + W.span + ' · 월요일 아침에 옵니다';
  document.querySelector('.hero').innerHTML = W.head;
  document.getElementById('letter').innerHTML = W.body();

  document.getElementById('srcs').innerHTML = Object.keys(W.src).map(function (key) {
    var x = W.src[key];
    return '<div class="src" data-s="' + key + '"><span class="k">' + x[0] + '</span>'
      + '<span class="v">' + x[1] + '</span><span class="s">' + x[2] + '</span></div>';
  }).join('');

  document.getElementById('figs').innerHTML = W.figs.map(function (key) {
    var x = W.src[key];
    return '<div class="fig in"><span class="k">' + x[0] + '</span>'
      + '<span class="v">' + x[1] + '</span><span class="s">' + x[2] + '</span></div>';
  }).join('');

  /* 지난 브리핑은 지금 보는 주를 뺀 나머지입니다 */
  document.getElementById('hist').innerHTML = WEEKS
    .map(function (o, i) { return { o:o, i:i }; })
    .filter(function (z) { return z.i !== n; })
    .map(function (z) {
      return '<button class="r" data-w="' + z.i + '"><span class="grow">'
        + '<span class="nm">' + z.o.label + '</span>'
        + '<span class="mt">' + z.o.head.replace(/<[^>]+>/g, '') + '</span></span>'
        + '<span class="go">›</span></button>';
    }).join('');

  document.getElementById('weeks').querySelectorAll('.pill').forEach(function (p) {
    p.setAttribute('aria-pressed', String(+p.dataset.w === n));
  });
}

document.getElementById('weeks').innerHTML = WEEKS.map(function (w, i) {
  return '<button class="pill" data-w="' + i + '" aria-pressed="' + (i === 0) + '">'
    + w.label + '</button>';
}).join('');

/* ── 문장의 숫자와 곁줄의 근거를 잇습니다 ── */
function light(k) {
  document.querySelectorAll('.cite, .src').forEach(function (e) {
    e.classList.toggle('on', !!k && e.dataset.s === k);
  });
  if (k) {
    var s = document.querySelector('.src[data-s="' + k + '"]');
    if (s) s.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}
document.getElementById('letter').addEventListener('click', function (e) {
  var c = e.target.closest('.cite');
  light(c ? c.dataset.s : null);
});
document.getElementById('srcs').addEventListener('click', function (e) {
  var s = e.target.closest('.src'); if (!s) return;
  light(s.dataset.s);
  var c = document.querySelector('.cite[data-s="' + s.dataset.s + '"]');
  if (c) c.scrollIntoView({ behavior:'smooth', block:'center' });
});
document.getElementById('hist').addEventListener('click', function (e) {
  var b = e.target.closest('[data-w]'); if (!b) return;
  drawWeek(+b.dataset.w);
});
document.getElementById('weeks').addEventListener('click', function (e) {
  var b = e.target.closest('.pill'); if (!b) return;
  drawWeek(+b.dataset.w);
});

drawWeek(0);
wireReveal();
mountFeatures('pc-reports');
</script>
</body>
</html>

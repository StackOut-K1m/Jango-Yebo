<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔고예보 · 거래</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="sky.css">
<link rel="stylesheet" href="features.css">
<style>
.tbl .tr { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s3); }
.tbl .dt { display:none; }
</style>
</head>
<body class="m">

<header class="sky slim" id="sky">
  <div class="top" id="top"></div>
  <div class="answer">
    <p class="when">최근 7일</p>
    <h1 class="hero"><b><span class="n" id="needN">0</span>건</b>만 확인하면 됩니다</h1>

  </div>
</header>

<main class="ground">
  <section class="sec">
    <h2>거래</h2>
    <div class="tbl">
      <div id="txBody"></div>
    </div>
  </section>

  <section class="sec">
    <h2>이 기간의 셈</h2>
    <div class="figs" id="txFigs"></div>
  </section>
</main>
<div id="tabs"></div>
<div class="pin" id="pin"></div>

<script src="sky.js"></script>
<script src="nav.js"></script>
<script src="features.js"></script>
<script src="store.js"></script>
<script>
/* 이 화면은 지금 고른 가게 것을 그립니다. 원본 목록을 가게 것으로 가립니다. */
var TX = txForShop(), FIXED = fixedForShop();
document.getElementById('top').outerHTML = mTop('거래', 'm-home.html');
document.getElementById('tabs').outerHTML = mTabs('tx');
(function () {
  var k = SKYC['safe'], s = document.getElementById('sky');
  s.dataset.w = 'safe';
  s.style.setProperty('--k0',k[0]); s.style.setProperty('--k1',k[1]); s.style.setProperty('--k2',k[2]);
})();

var CAT = { 'RULE':['규칙',''], 'DICT':['사전',''], 'AI':['AI','bd-ai'], 'USER':['내가 확정',''] };
document.getElementById('txBody').innerHTML = TX.map(function (t) {
  var c = CAT[t[6]], low = t[7] < 0.8 && !t[8];
  return '<button class="tr" data-i="' + TX.indexOf(t) + '">'
    + '<span class="dt">' + t[0] + '</span>'
    + '<span><span class="nm ell">' + t[1] + '</span><span class="mt ell">' + t[2] + '</span></span>'
    + '<span><span class="bd ' + c[1] + '">' + t[5] + ' · ' + c[0] + '</span>'
      + (low ? ' <span class="bd bd-low">확인 필요</span>' : '') + '</span>'
    + '<span class="r amt' + (t[3] === 'in' ? ' in' : '') + '">'
      + (t[3] === 'in' ? '+' : '−') + won(t[4]) + '</span></button>';
}).join('');
var need = TX.filter(function (t) { return t[7] < 0.8 && !t[8]; }).length;
document.getElementById('needN').textContent = need;
var sumIn = TX.filter(function(t){return t[3]==='in';}).reduce(function(a,t){return a+t[4];},0);
var sumOut = TX.filter(function(t){return t[3]==='out';}).reduce(function(a,t){return a+t[4];},0);
document.getElementById('txFigs').innerHTML =
  '<div class="fig"><span class="k">들어온 돈</span><span class="v">' + won(sumIn) + '<small>원</small></span>'
  + '<span class="s">최근 7일 · 정산 ' + TX.filter(function(t){return t[3]==='in';}).length + '건</span></div>'
  + '<div class="fig"><span class="k">나간 돈</span><span class="v">' + won(sumOut) + '<small>원</small></span>'
  + '<span class="s">재료비가 ' + won(TX.filter(function(t){return t[5]==='재료비';}).reduce(function(a,t){return a+t[4];},0)) + '원입니다</span></div>'
  + '<div class="fig"><span class="k">남은 돈</span><span class="v">' + won(sumIn-sumOut) + '<small>원</small></span>'
  + '<span class="s">이 기간의 순증감입니다</span></div>'
  + '<div class="fig"><span class="k">확인이 필요한 것</span><span class="v">' + need + '<small>건</small></span>'
  + '<span class="s">분류 신뢰도가 낮거나 새 거래처입니다</span></div>';

/* ── 거래를 누르면 상세 ──
   분류를 고치면 그 자리에서 반영됩니다. 사장이 고친 것은 출처가 '내가 확정'이 되고
   신뢰도는 1 이 됩니다. 모델이 뒤에서 다시 바꾸지 않는다는 뜻입니다. */
var CATS = ['정산','재료비','인건비','임차료','공과금','소모품','대출','세금'];

function redrawTx() {
  document.getElementById('txBody').innerHTML = TX.map(function (t) {
    var c = CAT[t[6]], low = t[7] < 0.8 && !t[8];
    return '<button class="tr" data-i="' + TX.indexOf(t) + '">'
      + '<span class="dt">' + t[0] + '</span>'
      + '<span><span class="nm ell">' + t[1] + '</span><span class="mt ell">' + t[2] + '</span></span>'
      + '<span><span class="bd ' + c[1] + '">' + t[5] + ' · ' + c[0] + '</span>'
        + (low ? ' <span class="bd bd-low">확인 필요</span>' : '')
        + (t.shop === null ? ' <span class="bd">미배분</span>' : '') + '</span>'
      + '<span class="amt' + (t[3] === 'in' ? ' in' : '') + '">'
        + (t[3] === 'in' ? '+' : '−') + won(t[4]) + '</span></button>';
  }).join('');
}
redrawTx();

document.getElementById('txBody').addEventListener('click', function (e) {
  var b = e.target.closest('.tr[data-i]'); if (!b) return;
  var t = TX[+b.dataset.i];
  var pick = function (cat) {
    t[5] = cat; t[6] = 'USER'; t[7] = 1;
    redrawTx(); sheetClose();
  };
  var body = '<p class="dm" style="margin-top:var(--s5);font-size:11px;color:var(--ink-3)">분류 고치기</p>'
    + '<div class="pills" style="margin-top:var(--s3)">'
    + CATS.map(function (c) {
        return '<button class="pill" data-c="' + c + '"'
          + (c === t[5] ? ' aria-pressed="true"' : '') + '>' + c + '</button>';
      }).join('') + '</div>'
    + (t.shop === null
      ? '<p class="dm" style="margin-top:var(--s6);font-size:11.5px;color:var(--ink-2);line-height:1.65">'
        + '<b>어느 가게 것인지 아직 못 갈랐습니다.</b> ' + PURSE.name + '을 두 가게가 함께 쓰기 때문입니다. '
        + '가르지 않으면 가게별 수익이 범위로만 나옵니다.</p>'
      : '');
  sheetOpen({
    title: t[1],
    sub: t[0] + ' · ' + t[2],
    rows: [
      ['금액', (t[3] === 'in' ? '+' : '−') + won(t[4]) + '원', true],
      ['분류', t[5], false],
      ['어떻게 분류했나', CAT[t[6]][0] + (t[6] === 'USER' ? '' : ' · 신뢰도 ' + Math.round(t[7]*100) + '%'), false],
      ['증빙', t[8] ? '붙었습니다' : '없습니다', false]
    ],
    body: body,
    acts: t[8] ? [] : [['증빙 찍기', function () { location.href = 'm-shoot.html'; }, true]]
  });
  var bs = document.getElementById('bs');
  bs.addEventListener('click', function (ev) {
    var p = ev.target.closest('.pill[data-c]'); if (p) pick(p.dataset.c);
  });
});

wireReveal();
mountFeatures('m-transactions');
</script>
</body>
</html>

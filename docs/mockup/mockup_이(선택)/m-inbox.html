<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔고예보 · 확인 센터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="sky.css">
<link rel="stylesheet" href="features.css">

</head>
<body class="m">

<header class="sky slim" id="sky">
  <div class="top" id="top"></div>
  <div class="answer">
    <p class="when">한 장씩 넘기면 됩니다</p>
    <h1 class="hero"><b><span class="n" id="leftN">0</span>건</b> 남았습니다</h1>

  </div>
</header>

<main class="ground">
  <section class="sec">
    <h2>반복 후보</h2>
    <div class="stack" id="patCand"></div>
  </section>

  <section class="sec">
    <h2>이미 확정한 규칙</h2>
    <div class="rows" id="patDone"></div>
  </section>

  <section class="sec">
    <h2>예보 품질</h2>
    <div class="figs" id="patFigs"></div>
  </section>
</main>
<div id="tabs"></div>
<div class="pin" id="pin"></div>

<script src="sky.js"></script>
<script src="nav.js"></script>
<script src="features.js"></script>
<script src="store.js"></script>
<script>
/* 이 화면은 지금 고른 가게 것을 그립니다. 원본 목록을 가게 것으로 가립니다. */
var TX = txForShop(), FIXED = fixedForShop();
document.getElementById('top').outerHTML = mTop('확인할 일', 'm-home.html');
document.getElementById('tabs').outerHTML = mTabs('');
(function () {
  var k = SKYC['safe'], s = document.getElementById('sky');
  s.dataset.w = 'safe';
  s.style.setProperty('--k0',k[0]); s.style.setProperty('--k1',k[1]); s.style.setProperty('--k2',k[2]);
})();

var CONF = { HIGH:'높음', MEDIUM:'보통', LOW:'낮음', UNPREDICTABLE:'예측 불가' };
document.getElementById('patCand').innerHTML = PATTERNS.filter(function(p){return p[6]==='CANDIDATE';})
 .map(function (p, i) {
  return '<div class="sheet" data-i="' + i + '">'
    + '<p class="ask">' + p[7] + ' <b>' + p[0] + '</b>으로 등록할까요?</p>'
    + '<p class="meta">' + p[1] + ' · ' + (p[2]==='in'?'들어옴':'나감') + ' '
      + won(p[3][0]) + '~' + won(p[3][1]) + '원 · 관측 ' + p[4] + '회 · 신뢰도 ' + CONF[p[5]] + '</p>'
    + '<div class="btn-row">'
      + '<button class="btn btn-pri js-ok">등록</button>'
      + '<button class="btn btn-sub">금액 고쳐서 등록</button>'
      + '<button class="btn btn-sub js-no">반복 아닙니다</button>'
    + '</div></div>';
}).join('');

document.getElementById('patDone').innerHTML = PATTERNS.filter(function(p){return p[6]==='CONFIRMED';})
 .map(function (p) {
  return '<div class="r"><span class="grow"><span class="nm">' + p[0] + '</span>'
    + '<span class="mt">' + p[1] + ' · 관측 ' + p[4] + '회 · 신뢰도 ' + CONF[p[5]] + '</span></span>'
    + '<span class="amt">' + (p[2]==='in'?'+':'−') + won(p[3][0]) + '</span></div>';
}).join('');

/* 처리하면 종이가 넘어갑니다 */
/* ── 후보를 처리합니다 ──
   전에는 .done 클래스만 붙여서 겉만 흐려지고 PATTERNS 는 그대로였습니다.
   그러면 아래 '확정한 규칙' 수와 예보 정확도가 따라 움직이지 않아,
   사장이 처리한 것이 예보에 반영됐는지 알 수 없습니다.
   상태를 실제로 바꾸고 화면 전체를 다시 그립니다. */
function redrawInbox() {
  var cand = PATTERNS.filter(function (p) { return p[6] === 'CANDIDATE'; });
  var done = PATTERNS.filter(function (p) { return p[6] === 'CONFIRMED'; });

  document.getElementById('patCand').innerHTML = cand.length
    ? cand.map(function (p) {
        var i = PATTERNS.indexOf(p);
        return '<div class="sheet" data-i="' + i + '">'
          + '<p class="ask">' + p[7] + ' <b>' + p[0] + '</b>으로 등록할까요?</p>'
          + '<p class="meta">' + p[1] + ' · ' + (p[2]==='in'?'들어옴':'나감') + ' '
            + won(p[3][0]) + '~' + won(p[3][1]) + '원 · 관측 ' + p[4] + '회 · 신뢰도 ' + CONF[p[5]] + '</p>'
          + '<div class="btn-row">'
            + '<button class="btn btn-pri js-ok">등록</button>'
            + '<button class="btn btn-sub js-edit">금액 고쳐서 등록</button>'
            + '<button class="btn btn-sub js-no">반복 아닙니다</button>'
          + '</div></div>';
      }).join('')
    : '<p class="dm" style="font-size:13px;color:var(--ink-2);line-height:1.7;padding:var(--s6) 0">'
      + '확인할 후보가 없습니다. 새 거래가 쌓이면 다시 찾아 드립니다.</p>';

  document.getElementById('patDone').innerHTML = done.map(function (p) {
    return '<div class="r"><span class="grow"><span class="nm">' + p[0] + '</span>'
      + '<span class="mt">' + p[1] + ' · ' + won(p[3][0]) + '~' + won(p[3][1]) + '원</span></span></div>';
  }).join('');

  document.getElementById('leftN').textContent = cand.length;
  document.getElementById('patFigs').innerHTML =
    '<div class="fig"><span class="k">확정한 규칙</span><span class="v">' + done.length + '<small>건</small></span>'
    + '<span class="s">예보에 그대로 들어갑니다</span></div>'
    + '<div class="fig"><span class="k">예보 정확도</span><span class="v">' + ACCURACY.pct + '<small>%</small></span>'
    + '<span class="s">입금일 평균 ' + ACCURACY.dayGap + '일 차이 · 금액 −' + ACCURACY.amtGap + '%</span>'
    + '<span class="rail"><i data-w="' + ACCURACY.pct + '"></i></span></div>';
  paintRails();
}

document.getElementById('patCand').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var card = b.closest('.sheet'); if (!card) return;
  var i = +card.dataset.i, p = PATTERNS[i];

  if (b.classList.contains('js-ok')) { p[6] = 'CONFIRMED'; redrawInbox(); return; }
  if (b.classList.contains('js-no')) { p[6] = 'DISMISSED'; redrawInbox(); return; }

  if (b.classList.contains('js-edit')) {
    /* 범위를 사장이 직접 좁힙니다. 모델이 6주를 봐도 사장이 아는 것만 못할 때가 있습니다. */
    sheetOpen({
      title: p[0],
      sub: p[1] + ' · 모델이 잡은 범위는 ' + won(p[3][0]) + '~' + won(p[3][1]) + '원입니다',
      rows: [['관측', p[4] + '회', false], ['신뢰도', CONF[p[5]], false]],
      body: '<p class="dm" style="margin-top:var(--s5);font-size:11px;color:var(--ink-3)">'
        + '얼마로 잡을까요</p>'
        + '<div class="pills" style="margin-top:var(--s3)" id="amtPick">'
        + [p[3][0], Math.round((p[3][0]+p[3][1])/2), p[3][1]].map(function (v, n) {
            return '<button class="pill" data-v="' + v + '"' + (n===1?' aria-pressed="true"':'') + '>'
              + won(v) + '원</button>';
          }).join('')
        + '</div>'
        + '<p class="dm" id="amtNote" style="margin-top:var(--s5);font-size:11.5px;color:var(--ink-2);line-height:1.65">'
        + '고른 금액 하나로 예보에 들어갑니다. 범위가 아니라 한 값이 됩니다.</p>',
      acts: [['이 금액으로 등록', function () {
        var sel = document.querySelector('#amtPick .pill[aria-pressed="true"]');
        var v = sel ? +sel.dataset.v : Math.round((p[3][0]+p[3][1])/2);
        p[3] = [v, v]; p[5] = 'HIGH'; p[6] = 'CONFIRMED';
        sheetClose(); redrawInbox();
      }, true]]
    });
    var bs = document.getElementById('bs');
    bs.addEventListener('click', function (ev) {
      var q = ev.target.closest('#amtPick .pill'); if (!q) return;
      document.querySelectorAll('#amtPick .pill').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === q));
      });
    });
  }
});

redrawInbox();

document.getElementById('patFigs').innerHTML =
  '<div class="fig"><span class="k">확정한 규칙</span><span class="v">' + PATTERNS.filter(function(p){return p[6]==='CONFIRMED';}).length + '<small>건</small></span>'
  + '<span class="s">예보에 그대로 들어갑니다</span></div>'
  + '<div class="fig"><span class="k">예보 정확도</span><span class="v">84.2<small>%</small></span>'
  + '<span class="s">입금일 평균 1.3일 차이 · 금액 −3.2%</span><span class="rail"><i data-w="84.2"></i></span></div>'
  + '<div class="fig"><span class="k">적용 중인 보정</span><span class="v">+1.2<small>일</small></span>'
  + '<span class="s">배달의민족 정산이 평균 1.2일 늦게 들어왔습니다</span></div>';

wireReveal();
mountFeatures('m-inbox');
</script>
</body>
</html>

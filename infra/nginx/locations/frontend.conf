# 웹 SPA. 443 server 블록 안에 include 된다.
#
# SPA 라우팅(try_files)·캐시 헤더는 **컨테이너 안쪽 nginx** 가 맡는다 (frontend/nginx.conf).
# 엣지는 프록시만 한다 — 두 곳에 두면 어느 쪽 설정이 먹었는지 가려내기 어려워진다.
#
# ⚠ 이 파일과 conf.d/default.conf 의 안내용 `location /` 제거는 **반드시 같이 나간다.**
#    location / 가 두 곳에 있으면 nginx 가 duplicate location 으로 아예 뜨지 않는다.
location / {
    # 변수 proxy_pass + resolver 조합이라 업스트림을 런타임에 다시 찾는다.
    # 컨테이너를 재생성해 IP 가 바뀌어도 502 가 남지 않는다 (api.conf 와 같은 이유).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend;
    proxy_pass $frontend_upstream$request_uri;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
}

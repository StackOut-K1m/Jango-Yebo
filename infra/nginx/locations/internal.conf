# 서비스 간 내부 API 차단 — 인터넷에서 /internal/** 로 닿지 못하게 한다.
#
# 백엔드 InternalSecurityConfig 주석이 요구한 명시적 차단이다.
# 워커(jango-ai)는 이 경로를 쓰지만 **엣지를 거치지 않는다** — internal 네트워크에서
# http://jango-api:8080 으로 직접 붙는다(ai.env 의 BACKEND_BASE_URL). 그래서 여기서
# 막아도 콜백은 그대로 돈다.
#
# ── 왜 필요한가 (2026-09-15) ────────────────────────────────────────────────
# 이 파일이 없어도 지금은 밖에서 안 닿는다. 프론트가 `location /` 을 가져가면서
# /internal/** 이 frontend 컨테이너로 흘러 SPA HTML(200)이나 405 를 돌려주기 때문이다.
#
# **그건 차단이 아니라 라우팅의 부수 효과다.** 누군가 `location /` 을 API 쪽으로 되돌리거나
# 프론트를 걷어내는 순간 구멍이 다시 열리고, 그때는 서비스 토큰이 유일한 방어선이 된다.
# 배치가 바뀌어도 의도가 남도록 여기에 못박는다.
#
# `^~` 를 쓰는 이유: 일반 prefix 보다 우선순위가 높고 **정규식 location 보다도 앞선다.**
# 나중에 누가 정규식 location 을 추가해도 이 차단이 먼저 걸린다.
# 슬래시 없는 `/internal` 도 함께 막는다 — `/internal/` 로만 쓰면 `/internal` 은 샌다.
#
# 403 이 아니라 404 인 이유: 그 경로가 존재한다는 사실 자체를 알리지 않는다.
location ^~ /internal {
    access_log /var/log/nginx/access.log;
    return 404;
}

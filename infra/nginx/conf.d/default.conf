map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name portfolio.example.invalid;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portfolio.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/portfolio.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.invalid/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /healthz {
        default_type text/plain;
        return 200 "edge ok (tls)\n";
    }

    # `location /` 는 locations/frontend.conf 가 가진다 (웹 SPA 프록시).
    # 여기에 다시 두면 duplicate location 으로 nginx 가 뜨지 않는다.
    include /etc/nginx/locations/*.conf;
}
